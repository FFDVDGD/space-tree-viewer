<!doctype html>
<meta charset="utf-8">
<title>CSV 导入回归测试</title>
<pre id="results">正在测试…</pre>
<iframe id="viewer" title="被测试的查看器" width="1000" height="650"></iframe>
<script type="module">
const frame=document.getElementById('viewer'),results=document.getElementById('results');
const ready=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
frame.src='../index.html?import-test='+Date.now();await ready;
const view=frame.contentWindow,doc=view.document,report=[];
const languages=[
 {name:'中文',columns:['文件名称','大小','分配','修改时间','文件','文件夹','DRIVECAPACITY','FREESPACE','USEDSPACE']},
 {name:'English',columns:['File Name','Size','Allocated','Modified','Files','Folders','DRIVECAPACITY','FREESPACE','USEDSPACE']}
];
for(const language of languages)for(const separator of [',',';','\t'])for(const allocated of [true,false]){
 const name=`${language.name} / ${JSON.stringify(separator)} / ${allocated?'分配优先':'大小回退'}`;
 try{
  const columns=[...language.columns],value=allocated?41:93;
  const rows=[['C:\\',93,41,'2026/11/01 02:12:09',1,0,1000,1000-value,value],['C:\\alpha,beta.txt',93,41,'2026/11/01 02:12:09',1,0]];
  if(!allocated){columns.splice(2,1);for(const row of rows)row.splice(2,1)}
  const csv='\uFEFFGenerated by WizTree\r\n'+[columns,...rows].map(row=>row.map(cell=>'"'+String(cell).replaceAll('"','""')+'"').join(separator)).join('\r\n');
  const transfer=new view.DataTransfer();transfer.items.add(new view.File([csv],'header-test.csv',{type:'text/csv'}));
  const input=doc.getElementById('file-input');input.files=transfer.files;input.dispatchEvent(new view.Event('change',{bubbles:true}));
  const deadline=Date.now()+5000;while(!doc.getElementById('loading').hidden){if(Date.now()>deadline)throw Error('导入超时');await new Promise(resolve=>setTimeout(resolve,10))}
  if(!doc.getElementById('notice').hidden)throw Error(doc.getElementById('notice-text').textContent);
  const root=view.spaceTree.current,file=root.children.find(node=>node.name==='alpha,beta.txt');
  if(root.path!=='C:\\'||root.value!==value||root.logical!==93||root.capacity!==1000||root.free!==1000-value||root.files!==1||root.folders!==0)throw Error('目录数值或元数据不符');
  if(!file||file.value!==value||file.logical!==93||file.modified!=='2026/11/01 02:12:09')throw Error('文件数值或修改时间不符');
  if(!doc.getElementById('treemap').textContent.includes(value+' B'))throw Error('树图未显示导入数值');
  report.push({name,passed:true});
 }catch(error){report.push({name,passed:false,error:error.message})}
}
results.textContent=JSON.stringify(report,null,2);
document.body.dataset.result=report.every(test=>test.passed)?'pass':'fail';
</script>
